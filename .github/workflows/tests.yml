name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate source tree
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('ADAPTER_SOURCE_ROOT=' + ('src' if Path('src/edition.json').is_file() else '.') + '\n')
      - run: python -m unittest discover -s tests -v
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - name: Windows background updater preflight
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Pythonw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          $Process = Start-Process -FilePath $Pythonw -ArgumentList @('-m', 'unittest', 'discover', '-s', 'tests', '-q') -Wait -PassThru -RedirectStandardError 'windowless-test.log' -RedirectStandardOutput 'windowless-output.log'
          Get-Content 'windowless-test.log'
          if ($Process.ExitCode -ne 0) { exit $Process.ExitCode }
      - run: node tests/route.test.cjs
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python -m compileall -q .
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/check_release.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
  macos-signing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate source tree
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('ADAPTER_SOURCE_ROOT=' + ('src' if Path('src/edition.json').is_file() else '.') + '\n')
      - run: python -m unittest discover -s tests -v
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/test_macos_signing.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
      - run: python scripts/check_release.py
        working-directory: ${{ env.ADAPTER_SOURCE_ROOT }}
