name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - name: Windows background updater preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Pythonw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          $Process = Start-Process -FilePath $Pythonw -ArgumentList @('-m', 'unittest', 'discover', '-s', 'tests', '-q') -Wait -PassThru -RedirectStandardError 'windowless-test.log' -RedirectStandardOutput 'windowless-output.log'
          Get-Content 'windowless-test.log'
          if ($Process.ExitCode -ne 0) { exit $Process.ExitCode }
      - run: node tests/route.test.cjs
      - run: python -m compileall -q patch.py backend.py compatibility.py monitor.py model_sync.py updater.py update_worker.py windows_support.py windows_install.py proxy_support.py local_support.py local_bridge.py responses_compat.py scripts tests
      - run: python scripts/check_release.py
